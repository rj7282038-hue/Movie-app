<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08080c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EPIC OTT — Watch Now</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/player.css">
    
    <!-- Favicon / App Icon -->
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
</head>
<body class="player-page">

    <!-- Player Sticky Header -->
    <nav class="player-nav-header" id="playerNav">
        <button class="icon-btn" id="btnBackToHome" aria-label="Back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="player-nav-title" id="navMovieTitle">Loading Stream...</span>
        <button class="icon-btn" id="btnShareMedia" aria-label="Share">
            <i class="fas fa-share-alt"></i>
        </button>
    </nav>

    <!-- Cinema Stage: Ambient Backlight & 16:9 Video Frame -->
    <div class="cinema-stage">
        <div class="ambient-glow-wrapper">
            <div class="ambient-glow-diffuser" id="ambientDiffuser"></div>
            
            <div class="video-frame-box" id="videoFrameContainer">
                <!-- Netflix Style Spinner & Server Indicator -->
                <div class="player-loader-state" id="playerLoader">
                    <div class="stream-spinner"></div>
                    <span class="stream-status-text" id="streamStatusText">Connecting to High Speed Server...</span>
                </div>
                
                <!-- Main Streaming Frame -->
                <iframe
                    id="videoPlayerFrame"
                    src=""
                    allowfullscreen="true"
                    webkitallowfullscreen="true"
                    mozallowfullscreen="true"
                    allow="accelerometer; autoplay *; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen *"
                    referrerpolicy="no-referrer">
                </iframe>

                <!-- Floating Landscape / Fullscreen Controls Overlay -->
                <div class="landscape-floating-controls" id="landscapeControls">
                    <button class="cinema-ctrl-btn" id="btnExitFullscreen" aria-label="Exit Fullscreen">
                        <i class="fas fa-arrow-left"></i> <span>Back</span>
                    </button>
                    <div class="ctrl-group-right">
                        <button class="cinema-ctrl-btn" id="btnAudioHint" aria-label="Audio Language">
                            <i class="fas fa-headphones"></i> <span>Audio</span>
                        </button>
                        <button class="cinema-ctrl-btn" id="btnToggleZoom" aria-label="Toggle Screen Fill">
                            <i class="fas fa-maximize"></i> <span id="zoomBtnText">Fill Screen</span>
                        </button>
                        <button class="cinema-ctrl-btn" id="btnServerQuick" aria-label="Next Server">
                            <i class="fas fa-server"></i> <span id="serverQuickText">S1</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Multi-Audio & Server Switching Bar -->
        <div class="server-bar-wrapper">
            <div class="server-bar">
                <span class="server-label-hint"><i class="fas fa-headphones"></i> Audio:</span>
                <button class="server-pill active" data-server="1">
                    <span class="dot"></span> <i class="fas fa-bolt"></i> VidLink (Fast HD)
                </button>
                <button class="server-pill" data-server="2">
                    <span class="dot"></span> 🇮🇳 Smashy (Hindi / Dual)
                </button>
                <button class="server-pill" data-server="3">
                    <span class="dot"></span> 🔊 Videasy (Multi-Lang)
                </button>
                <button class="server-pill" data-server="4">
                    <span class="dot"></span> 🌍 SuperEmbed (Global Dubs)
                </button>
            </div>
        </div>

        <!-- TV Series Episode Quick Nav (Shown for TV Shows) -->
        <div class="episode-quick-controls" id="epQuickControls">
            <button class="ep-nav-btn" id="btnPrevEp" disabled>
                <i class="fas fa-backward-step"></i> Prev Ep
            </button>
            <span class="current-ep-badge" id="epBadgeText">Season 1 : Episode 1</span>
            <button class="ep-nav-btn" id="btnNextEp">
                Next Ep <i class="fas fa-forward-step"></i>
            </button>
        </div>
    </div>

    <!-- Media Details Body -->
    <main class="player-details-body">
        <!-- Title & Meta Header -->
        <div class="title-row">
            <h1 class="media-main-title" id="mediaTitle">Loading title...</h1>
            <div class="media-meta-bar" id="mediaMeta"></div>
        </div>

        <!-- Quick Action Bar -->
        <div class="media-actions-strip">
            <button class="action-chip-btn" id="actionFavBtn">
                <i class="far fa-heart"></i>
                <span id="favBtnLabel">My List</span>
            </button>
            <button class="action-chip-btn" id="actionShareBtn">
                <i class="fas fa-share-nodes"></i>
                <span>Share</span>
            </button>
            <button class="action-chip-btn" id="actionReloadBtn">
                <i class="fas fa-rotate"></i>
                <span>Reload</span>
            </button>
            <button class="action-chip-btn" id="actionFullscreenBtn">
                <i class="fas fa-expand"></i>
                <span>Fullscreen</span>
            </button>
        </div>

        <!-- Synopsis / Overview -->
        <div>
            <h3 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 6px;">Storyline</h3>
            <p class="synopsis-text" id="mediaOverview">Fetching synopsis details...</p>
        </div>

        <!-- TV Show Seasons & Episode Drawer (Auto Populated for TV) -->
        <section class="episodes-section" id="episodesSection">
            <div class="episodes-header-row">
                <h3 style="font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-list" style="color: var(--primary);"></i> Episodes
                </h3>
                <select class="season-select-box" id="seasonSelect"></select>
            </div>
            <div class="episodes-grid-list" id="episodesList"></div>
        </section>

        <!-- Cast & Crew -->
        <section style="margin-top: 8px;">
            <h3 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 10px;">Top Cast</h3>
            <div class="cast-track-container" id="castTrack"></div>
        </section>

        <!-- Similar / Recommended Movies -->
        <section style="margin-top: 14px;">
            <h3 style="font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-fire" style="color: var(--primary);"></i> More Like This
            </h3>
            <div class="grid-container" id="similarGrid" style="padding: 0;"></div>
        </section>
    </main>

    <!-- Toast -->
    <div class="app-toast" id="appToast">
        <i class="fas fa-check-circle" style="color: var(--green);"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- Scripts -->
    <script src="js/player.js"></script>
</body>
</html>
