<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1e28" />
      <stop offset="50%" stop-color="#0f0f16" />
      <stop offset="100%" stop-color="#08080c" />
    </radialGradient>
    
    <!-- Red Crimson Glow -->
    <radialGradient id="redGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Red 3D Gradient for G -->
    <linearGradient id="primaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47" />
      <stop offset="30%" stop-color="#e50914" />
      <stop offset="70%" stop-color="#b20710" />
      <stop offset="100%" stop-color="#590005" />
    </linearGradient>

    <linearGradient id="accentFilm" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0.7" />
    </linearGradient>
    
    <filter id="shadowG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#e50914" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Ambient Glow Behind G -->
  <circle cx="256" cy="235" r="180" fill="url(#redGlow)" />

  <!-- Iconic 3D Stylized 'G' with Film Elements -->
  <g filter="url(#shadowG)">
    <!-- Main Outer Arc of G -->
    <path d="M 330 145 C 290 100, 190 100, 140 160 C 85 225, 85 315, 145 375 C 205 435, 310 430, 360 380 C 390 350, 400 310, 400 270 L 260 270 L 260 215 L 450 215 C 455 270, 440 340, 395 395 C 325 470, 185 475, 105 395 C 25 315, 25 195, 105 115 C 180 40, 320 40, 385 105 Z" fill="url(#primaryRed)" />

    <!-- Film Strip Sprocket Holes / Accents on G Crossbar -->
    <rect x="280" y="235" width="16" height="20" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="315" y="235" width="16" height="20" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="350" y="235" width="16" height="20" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="385" y="235" width="16" height="20" rx="3" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Inner Gloss Highlight Arc -->
  <path d="M 130 140 C 190 85, 290 85, 340 135" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="256" y="470" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GHAZI OTT</text>
</svg>
