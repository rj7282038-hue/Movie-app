name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime!

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Initialize & Configure Capacitor Android
        run: |
          # Add android platform if not already added
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync web code into android assets
          npx cap sync android

      - name: Configure Android Permissions & Hardware Acceleration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Inject permissions if not already present
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST"
          fi
          
          # Enable usesCleartextTraffic & hardwareAccelerated on application tag
          sed -i 's/<application /<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" /g' "$MANIFEST"
          
          echo "Manifest successfully patched with OTT streaming permissions!"

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/Ghazi-OTT-v1.0.apk
          echo "APK successfully built and ready at output_apk/Ghazi-OTT-v1.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghazi-OTT-APK-Build
          path: output_apk/Ghazi-OTT-v1.0.apk
          retention-days: 30

      - name: Create Release (Optional / Triggered on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output_apk/Ghazi-OTT-v1.0.apk
          name: "Ghazi OTT Mobile App v1.0"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
