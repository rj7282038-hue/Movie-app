name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger button from GitHub Actions tab anytime!

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html player.html manifest.json sw.js css js assets www/
          echo "Web assets successfully prepared in www/"

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions & Hardware Acceleration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Inject permissions if not already present
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST"
            fi
            
            # Enable usesCleartextTraffic & hardwareAccelerated on application tag
            sed -i 's/<application /<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" /g' "$MANIFEST"
            echo "Manifest configured with network permissions and hardware acceleration!"
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apk/Ghazi-OTT-v1.0.apk \;
          ls -lh output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghazi-OTT-APK-Build
          path: output_apk/Ghazi-OTT-v1.0.apk
          retention-days: 30
